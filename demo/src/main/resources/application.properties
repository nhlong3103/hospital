# =====================================================
# DATABASE CONFIGURATION
# =====================================================
spring.datasource.url=jdbc:mysql://localhost:3306/hospital_material_management?zeroDateTimeBehavior=CONVERT_TO_NULL
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================================
# JPA / HIBERNATE CONFIGURATION
# =====================================================
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialect cho MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Encoding
spring.jpa.properties.hibernate.connection.characterEncoding=utf-8
spring.jpa.properties.hibernate.connection.useUnicode=true

# =====================================================
# LOGGING CONFIGURATION
# =====================================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=INFO
logging.level.com.hospital=DEBUG

# =====================================================
# SERVER CONFIGURATION
# =====================================================
server.port=8080

# =====================================================
# JACKSON CONFIGURATION (JSON Serialization)
# =====================================================
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# =====================================================
# JWT CONFIGURATION
# =====================================================
# Đổi secret này khi triển khai thật (tối thiểu 32 ký tự)
jwt.secret=hospital-material-management-secret-key-change-me-in-production-2026
# Thời hạn token: 8 giờ (ms)
jwt.expiration-ms=28800000

# =====================================================
# FILE UPLOAD CONFIGURATION
# =====================================================
spring.servlet.multipart.max-file-size=11MB
spring.servlet.multipart.max-request-size=10MB
spring.devtools.restart.enabled=true